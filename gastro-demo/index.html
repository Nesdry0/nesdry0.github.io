<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GastroBalance Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="page-shell">
        <header class="topbar">
            <div>
                <span class="eyebrow">Demo interactiva</span>
                <h1>GastroBalance</h1>
            </div>
            <p class="topbar-note">Los datos se reinician al recargar la página.</p>
        </header>

        <nav class="tabs" aria-label="Secciones de la demo">
            <button class="tab is-active" data-tab="dashboard" type="button">Dashboard</button>
            <button class="tab" data-tab="inventario" type="button">Inventario</button>
            <button class="tab" data-tab="recetas" type="button">Recetas</button>
            <button class="tab" data-tab="ventas" type="button">Ventas</button>
            <button class="tab" data-tab="finanzas" type="button">Finanzas</button>
        </nav>

        <main>
            <section class="panel is-active" data-panel="dashboard">
                <div class="metrics" id="dashboardMetrics"></div>

                <div class="grid two-cols">
                    <article class="card">
                        <div class="card-header">
                            <h2>Recetas activas</h2>
                        </div>
                        <div id="recipeList"></div>
                    </article>

                    <article class="card">
                        <div class="card-header">
                            <h2>Punto de equilibrio</h2>
                        </div>
                        <div id="breakEvenCard" class="break-even-card"></div>
                    </article>
                </div>
            </section>

            <section class="panel" data-panel="inventario">
                <div class="card">
                    <div class="card-header">
                        <h2>Inventario</h2>
                    </div>
                    <div id="inventoryList" class="inventory-list"></div>
                </div>

                <div class="card form-card">
                    <div class="card-header">
                        <h2>Agregar ingrediente</h2>
                    </div>
                    <form id="ingredientForm" class="stacked-form">
                        <div class="field-row two-cols-form">
                            <label>
                                Nombre
                                <input type="text" name="name" placeholder="Ej: quinoa" required />
                            </label>
                            <label>
                                Categoría
                                <input type="text" name="category" placeholder="Ej: cereales" required />
                            </label>
                        </div>
                        <div class="field-row two-cols-form">
                            <label>
                                Unidad
                                <select name="unit">
                                    <option value="kg">kg</option>
                                    <option value="g">g</option>
                                    <option value="l">l</option>
                                    <option value="ml">ml</option>
                                    <option value="unid">unid</option>
                                </select>
                            </label>
                            <label>
                                Stock inicial
                                <input type="number" name="stock" min="0" step="0.1" value="10" required />
                            </label>
                        </div>
                        <div class="field-row two-cols-form">
                            <label>
                                Precio unitario
                                <input type="number" name="price" min="0" step="10" value="1200" required />
                            </label>
                            <button type="submit" class="primary-button">Guardar ingrediente</button>
                        </div>
                    </form>
                </div>
            </section>

            <section class="panel" data-panel="recetas">
                <div class="card">
                    <div class="card-header">
                        <h2>Recetas y costos</h2>
                    </div>
                    <div id="recipesTable" class="recipes-table"></div>
                </div>
            </section>

            <section class="panel" data-panel="ventas">
                <div class="grid two-cols">
                    <article class="card">
                        <div class="card-header">
                            <h2>Registrar venta</h2>
                        </div>
                        <form id="saleForm" class="stacked-form">
                            <label>
                                Plato
                                <select id="saleRecipe" name="recipe"></select>
                            </label>
                            <div class="field-row two-cols-form">
                                <label>
                                    Unidades
                                    <input type="number" name="units" min="1" step="1" value="1" required />
                                </label>
                                <label>
                                    Precio de venta
                                    <input type="number" name="salePrice" min="0" step="100" value="5200" required />
                                </label>
                            </div>
                            <div class="field-row two-cols-form">
                                <label>
                                    Canal
                                    <select name="channel">
                                        <option>Mostrador</option>
                                        <option>Delivery propio</option>
                                        <option>App delivery</option>
                                    </select>
                                </label>
                                <label>
                                    Referencia
                                    <input type="text" name="reference" value="Pedido demo" />
                                </label>
                            </div>
                            <div class="field-row two-cols-form">
                                <label>
                                    Costo delivery
                                    <input type="number" name="deliveryCost" min="0" step="100" value="0" />
                                </label>
                                <label>
                                    Comisión app
                                    <input type="number" name="platformFee" min="0" step="100" value="0" />
                                </label>
                            </div>
                            <button type="submit" class="primary-button">Registrar venta</button>
                        </form>
                    </article>

                    <article class="card">
                        <div class="card-header">
                            <h2>Últimas ventas</h2>
                        </div>
                        <div id="salesList" class="sales-list"></div>
                    </article>
                </div>
            </section>

            <section class="panel" data-panel="finanzas">
                <div class="card">
                    <div class="card-header">
                        <h2>Distribución financiera</h2>
                    </div>
                    <div id="financeShare" class="share-list"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>

</html>
